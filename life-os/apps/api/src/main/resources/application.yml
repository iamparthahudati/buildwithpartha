spring:
  application:
    name: life-os-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: LifeOsPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${FLYWAY_DATABASE_URL}
    user: ${FLYWAY_DATABASE_USERNAME}
    password: ${FLYWAY_DATABASE_PASSWORD}
    default-schema: lifeos_internal
    schemas:
      - lifeos_internal
      - public
    table: lifeos_schema_history
    create-schemas: false
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /life-os/api/v1
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

lifeos:
  public-url: ${APP_PUBLIC_URL}
  session-cookie-secure: ${APP_SESSION_COOKIE_SECURE}
  mail-from: ${APP_MAIL_FROM}
