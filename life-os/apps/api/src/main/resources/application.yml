spring:
  application:
    name: life-os-api
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      pool-name: LifeOsPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${FLYWAY_DATABASE_URL}
    user: ${FLYWAY_DATABASE_USERNAME}
    password: ${FLYWAY_DATABASE_PASSWORD}
    default-schema: lifeos_internal
    schemas:
      - lifeos_internal
      - public
    table: lifeos_schema_history
    create-schemas: false
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /life-os/api/v1
  forward-headers-strategy: framework

management:
  endpoints:
    access:
      default: none
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
      probes:
        enabled: true
      show-components: never
      show-details: never
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

springdoc:
  api-docs:
    enabled: true
    path: /openapi
  remove-broken-reference-definitions: false
  swagger-ui:
    enabled: false
  show-actuator: false

lifeos:
  public-url: ${APP_PUBLIC_URL}
  session-cookie-secure: ${APP_SESSION_COOKIE_SECURE}
  mail-from: ${APP_MAIL_FROM}
  export-storage-path: ${APP_EXPORT_STORAGE_PATH:/tmp/lifeos-exports}
