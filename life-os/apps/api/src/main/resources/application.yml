spring:
  application:
    name: life-os-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:55432/lifeos_local}
    username: ${DATABASE_USERNAME:lifeos_local_app}
    password: ${DATABASE_PASSWORD:lifeos_local_app_only}
    hikari:
      pool-name: LifeOsPool
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: ${FLYWAY_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://localhost:55432/lifeos_local}}
    user: ${FLYWAY_DATABASE_USERNAME:${DATABASE_USERNAME:lifeos_local_app}}
    password: ${FLYWAY_DATABASE_PASSWORD:${DATABASE_PASSWORD:lifeos_local_app_only}}
    default-schema: lifeos_internal
    schemas:
      - lifeos_internal
      - public
    table: lifeos_schema_history
    create-schemas: false
    baseline-on-migrate: false
    clean-disabled: true
    validate-on-migrate: true
    validate-migration-naming: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /life-os/api/v1
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
