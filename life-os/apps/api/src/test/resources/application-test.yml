spring:
  datasource:
    url: jdbc:h2:mem:lifeos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  mail:
    host: localhost
    port: 1025

lifeos:
  public-url: https://lifeos.example.test/life-os
  session-cookie-secure: true
  mail-from: lifeos@example.test
