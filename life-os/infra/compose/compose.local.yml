name: life-os-local

services:
  postgres:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_DB: ${LIFEOS_POSTGRES_DATABASE:-lifeos_local}
      POSTGRES_USER: ${LIFEOS_POSTGRES_ADMIN_USERNAME:-lifeos_local_admin}
      POSTGRES_PASSWORD: ${LIFEOS_POSTGRES_ADMIN_PASSWORD:-lifeos_local_admin_only}
      LIFEOS_APP_USERNAME: ${LIFEOS_POSTGRES_APP_USERNAME:-lifeos_local_app}
      LIFEOS_APP_PASSWORD: ${LIFEOS_POSTGRES_APP_PASSWORD:-lifeos_local_app_only}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${LIFEOS_POSTGRES_PORT:-55432}:5432"
    volumes:
      - life_os_postgres_data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - life_os_private
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  life_os_postgres_data:
    name: life-os-local-postgres-data
    labels:
      tech.buildwithpartha.lifeos.environment: local

networks:
  life_os_private:
    name: life-os-local-private
    internal: true
    labels:
      tech.buildwithpartha.lifeos.environment: local
