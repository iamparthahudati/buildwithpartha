# lifeos-logs.staging.conf — logrotate configuration for LifeOS STAGING host-level logs
#
# Specification: life-os/docs/59-CENTRALIZED-SAFE-LOGS.md (LOS-1611)
#
# Deploy to staging VPS:
#   sudo cp life-os/infra/logrotate/lifeos-logs.staging.conf /etc/logrotate.d/lifeos
#   sudo chmod 644 /etc/logrotate.d/lifeos
#   sudo logrotate -d /etc/logrotate.d/lifeos   # dry-run to verify
#
# Staging uses 7-day retention (half of production) because staging data is ephemeral.

/var/log/life-os/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    maxsize 200M
    create 0640 root deploy
    postrotate
        [ -f /var/run/crond.pid ] && kill -HUP "$(cat /var/run/crond.pid)" 2>/dev/null || true
    endscript
}
