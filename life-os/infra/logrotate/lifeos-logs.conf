# lifeos-logs.conf — logrotate configuration for LifeOS host-level logs
#
# Specification: life-os/docs/59-CENTRALIZED-SAFE-LOGS.md (LOS-1611)
#
# Deploy to VPS:
#   sudo cp life-os/infra/logrotate/lifeos-logs.conf /etc/logrotate.d/lifeos
#   sudo chmod 644 /etc/logrotate.d/lifeos
#   sudo logrotate -d /etc/logrotate.d/lifeos   # dry-run to verify
#
# Covers: backup status logs and any host-level LifeOS file logs in /var/log/life-os/
# Container logs are managed by the Docker json-file driver (see infra/compose/compose.prod.yml).

/var/log/life-os/*.log {
    # Rotate once per day
    daily

    # Keep 14 rotated copies (14-day history); older files are deleted
    rotate 14

    # gzip-compress rotated files to reduce disk usage
    compress

    # Delay compression by one cycle so any writer still holding the fd can finish
    delaycompress

    # Do not raise an error if log file does not exist (e.g., backup has not run yet)
    missingok

    # Skip rotation if file is empty
    notifempty

    # Run postrotate script once for all matched files, not per-file
    sharedscripts

    # Force rotation if a file exceeds 500 MB before the daily schedule
    # This is a disk-pressure guard independent of the daily rotation cadence
    maxsize 500M

    # New log files: owner=root, group=deploy, mode=640 (world has no access)
    create 0640 root deploy

    postrotate
        # Signal cron daemon to reopen any log file it may have open
        # Silently ignored if crond is not running
        [ -f /var/run/crond.pid ] && kill -HUP "$(cat /var/run/crond.pid)" 2>/dev/null || true
    endscript
}
