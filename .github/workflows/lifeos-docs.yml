name: LifeOS documentation

on:
  pull_request:
    paths:
      - "life-os/**"
      - ".github/workflows/lifeos-docs.yml"
  push:
    branches:
      - develop
      - master
    paths:
      - "life-os/**"
      - ".github/workflows/lifeos-docs.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check patch whitespace
        run: git diff --check HEAD^ HEAD
      - name: Validate LifeOS documentation
        run: node life-os/scripts/validate-docs.mjs

